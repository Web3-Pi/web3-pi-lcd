name: Build PR Artifact

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

jobs:
  build-pr-artifact:
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up mise
        uses: jdx/mise-action@v2

      - name: Install build tools
        run: mise install

      - name: Build release binary (aarch64-unknown-linux-gnu)
        run: mise run build-aarch64

      - name: Prepare PR artifact
        run: |
          cp target/aarch64-unknown-linux-gnu/release/w3p-hwm w3p-hwm-linux-arm64
          chmod +x w3p-hwm-linux-arm64

      - name: Upload PR artifact
        uses: actions/upload-artifact@v4
        with:
          name: w3p-hwm-linux-arm64
          path: w3p-hwm-linux-arm64
          if-no-files-found: error
