name: Build and Release

permissions:
  contents: write

on:
  push:
    tags:
      - "v*" # any tag starting with v (e.g. v0.2.0)
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.2.0)"
        required: true

jobs:
  build-and-release:
    # Native arm64 runner — the only architecture we ship (Raspberry Pi 5 / vOS).
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up mise
        uses: jdx/mise-action@v2

      - name: Install build tools
        run: mise install

      - name: Check TLS dependency policy and run tests
        run: |
          python3 scripts/check-tls-lock.py
          cargo test --locked

      - name: Build release binary (aarch64-unknown-linux-gnu)
        run: mise run build-aarch64

      - name: Prepare release assets
        run: |
          cp target/aarch64-unknown-linux-gnu/release/w3p-hwm w3p-hwm-linux-arm64
          chmod +x w3p-hwm-linux-arm64
          sha256sum w3p-hwm-linux-arm64 > w3p-hwm-linux-arm64.sha256
          cp packaging/w3p-hwm.service w3p-hwm.service
          ls -la w3p-hwm-linux-arm64 w3p-hwm-linux-arm64.sha256 w3p-hwm.service

      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: web3-pi-lcd ${{ steps.tag.outputs.name }}
          draft: false
          prerelease: false
          files: |
            w3p-hwm-linux-arm64
            w3p-hwm-linux-arm64.sha256
            w3p-hwm.service
          body: |
            **Web3 Pi LCD dashboard (`w3p-hwm`) ${{ steps.tag.outputs.name }}**

            A single self-contained aarch64 binary for Raspberry Pi 5 (Web3 Pi vOS).
            Font, logos and the opening animation are baked into the binary — no
            asset directory to deploy.

            ### Install / update on a running device
            ```bash
            curl -sSL https://raw.githubusercontent.com/${{ github.repository }}/main/install.sh | sudo bash
            ```
            Or use the **LCD Display** entry in the vOS Control Panel (System menu).

            ### Requirements
            - 1.69" ST7789V2 SPI LCD (Waveshare 24382 / Seeed 104990802)
            - SPI enabled (`dtparam=spi=on`) — on by default in Web3 Pi vOS
            - A missing or unwired panel is non-fatal: the service stays active and
              renders as soon as a panel appears.

            ### Assets
            - `w3p-hwm-linux-arm64` — the binary (installs to `/usr/local/bin/w3p-hwm`)
            - `w3p-hwm-linux-arm64.sha256` — checksum
            - `w3p-hwm.service` — systemd unit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
